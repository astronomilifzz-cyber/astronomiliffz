<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Security Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07050d;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(18, 14, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-text {
            background: linear-gradient(135deg, #f43f5e 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-btn {
            background: linear-gradient(135deg, #e11d48 0%, #9333ea 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.5);
            transform: translateY(-2px);
        }
        .danger-pulse {
            animation: dangerGlow 1s infinite alternate;
        }
        @keyframes dangerGlow {
            0% { box-shadow: 0 0 20px rgba(244, 63, 94, 0.2), inset 0 0 15px rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3); }
            100% { box-shadow: 0 0 45px rgba(244, 63, 94, 0.6), inset 0 0 25px rgba(244, 63, 94, 0.3); border-color: rgba(244, 63, 94, 0.8); }
        }
        .strobe-screen {
            animation: screenFlash 0.3s infinite alternate;
        }
        @keyframes screenFlash {
            0% { background-color: #07050d; }
            100% { background-color: #2b0c16; }
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

    <!-- Efek Ambient Background -->
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-rose-600/15 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-purple-600/15 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Tampilan 1: Tombol Aktivasi Utama -->
    <div id="permissionView" class="w-full max-w-md glass-panel rounded-3xl p-7 md:p-9 shadow-2xl relative z-10 text-center space-y-6">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shadow-inner">
            <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round5" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        
        <div class="space-y-2">
            <span class="px-3.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-rose-500/10 text-rose-400 border border-rose-500/20">
                Security Trigger
            </span>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                System <span class="gradient-text">Override</span>
            </h1>
            <p class="text-gray-400 text-xs md:text-sm leading-relaxed">
                Tekan tombol di bawah untuk memberikan izin akses hardware dan menginisialisasi sistem kontrol perangkat.
            </p>
        </div>

        <button id="startBtn" class="w-full py-4 rounded-xl glow-btn text-white font-bold text-sm md:text-base tracking-wide shadow-lg cursor-pointer">
            Izinkan & Jalankan Sistem
        </button>
    </div>

    <!-- Tampilan 2: Panel Terkunci & Senter Kedap-Kedip -->
    <div id="controlView" class="hidden w-full max-w-md glass-panel rounded-3xl p-7 md:p-9 shadow-2xl relative z-10 text-center space-y-6 danger-pulse">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-500 animate-bounce">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <div class="space-y-2">
            <h2 class="text-xl md:text-2xl font-black text-rose-500 tracking-wide uppercase">
                HAHA MASUKAN PW UNTUK MENGHENTIKAN
            </h2>
            <p class="text-gray-400 text-xs">Sistem dalam mode darurat. Senter menyala dan berkedip aktif.</p>
        </div>

        <div class="space-y-3.5">
            <div class="relative">
                <input type="password" id="pwInput" placeholder="Masukkan Password" 
                    class="w-full px-4 py-3.5 rounded-xl bg-black/60 border border-rose-500/30 text-white text-center font-mono tracking-widest placeholder-gray-600 focus:outline-none focus:border-rose-500 transition-all shadow-inner">
            </div>
            
            <button id="stopBtn" class="w-full py-3.5 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-300 font-bold text-sm tracking-wide transition-all cursor-pointer shadow-md">
                Hentikan Sistem
            </button>
        </div>

        <p id="errorMsg" class="text-xs text-rose-400 font-bold hidden animate-pulse">PASSWORD SALAH! AKSES DITOLAK.</p>
    </div>

    <!-- Script Logika Kedap-Kedip & Password -->
    <script>
        let track = null;
        let videoStream = null;
        let strobeInterval = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const permissionView = document.getElementById('permissionView');
        const controlView = document.getElementById('controlView');
        const mainBody = document.getElementById('mainBody');
        const pwInput = document.getElementById('pwInput');
        const errorMsg = document.getElementById('errorMsg');

        // Fungsi menjalankan kamera & efek kedap-kedip senter (strobe)
        async function startStrobeFlashlight() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                track = videoStream.getVideoTracks()[0];
                
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    // Pindah tampilan ke panel kontrol & efek kedip layar
                    permissionView.classList.add('hidden');
                    controlView.classList.remove('hidden');
                    mainBody.classList.add('strobe-screen');

                    let flashState = false;
                    // Efek kedap-kedip senter setiap 250ms
                    strobeInterval = setInterval(async () => {
                        flashState = !flashState;
                        try {
                            await track.applyConstraints({
                                advanced: [{ torch: flashState }]
                            });
                        } catch (e) {
                            console.error(e);
                        }
                    }, 250);

                } else {
                    alert("Hardware senter tidak didukung pada perangkat ini.");
                }
            } catch (err) {
                console.error(err);
                alert("Izin kamera/senter diperlukan untuk menjalankan program.");
            }
        }

        // Fungsi menghentikan total senter & sistem
        function stopStrobeFlashlight() {
            if (strobeInterval) {
                clearInterval(strobeInterval);
                strobeInterval = null;
            }
            if (track) {
                track.applyConstraints({
                    advanced: [{ torch: false }]
                }).then(() => {
                    track.stop();
                    if (videoStream) {
                        videoStream.getTracks().forEach(t => t.stop());
                    }
                    // Kembalikan tampilan semula
                    controlView.classList.add('hidden');
                    permissionView.classList.remove('hidden');
                    mainBody.classList.remove('strobe-screen');
                    pwInput.value = '';
                    errorMsg.classList.add('hidden');
                }).catch(err => console.error(err));
            }
        }

        // Event Tombol Izinkan & Mulai Otomatis
        startBtn.addEventListener('click', () => {
            startStrobeFlashlight();
        });

        // Event Tombol Berhenti dengan Validasi Password "LIFZZBUG"
        stopBtn.addEventListener('click', () => {
            const enteredPassword = pwInput.value.trim();
            if (enteredPassword === "LIFZZBUG") {
                errorMsg.classList.add('hidden');
                stopStrobeFlashlight();
            } else {
                errorMsg.classList.remove('hidden');
                pwInput.value = '';
            }
        });
    </script>
</body>
</html>
